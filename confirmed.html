<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>メール確認が完了しました | ドローン練習ノート</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#17233d;background:#f5f7fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column}
    .top{padding:16px 20px;background:#15284b;color:#fff;font-weight:700}
    .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(420px,100%);background:#fff;border:1px solid #dde4ee;border-radius:16px;padding:32px 24px;text-align:center}
    .mark{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:#e7f6ec;display:flex;align-items:center;justify-content:center}
    .mark svg{width:34px;height:34px}
    h1{font-size:20px;margin:0 0 10px}
    p{color:#62708a;font-size:14px;line-height:1.7;margin:0 0 8px}
    .hint{margin-top:18px;padding:12px 14px;background:#eef4ff;border-radius:10px;color:#2d5ca8;font-size:13px}
    .footer{text-align:center;color:#8590a5;font-size:12px;padding:16px}
  </style>
</head>
<body>
  <header class="top">🚁 ドローン練習ノート</header>
  <div class="wrap">
    <main class="card">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1e9e57" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </div>
      <h1>メール確認が完了しました</h1>
      <p>アカウントの登録が有効になりました。</p>
      <p>このページは閉じて、<b>ドローン練習ノートのアプリ</b>に戻り、ログインしてください。</p>
      <div class="hint">アプリを開いて、登録したメールアドレスとパスワードでログインすると、記録がクラウドに同期されます。</div>
    </main>
  </div>
  <div class="footer">ドローン練習ノート</div>
</body>
</html>
