<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>ドローン練習ノート 共有ページ</title>
  <style>
    :root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#17233d;background:#f5f7fb}
    body{margin:0}
    .loading{font-family:sans-serif;text-align:center;padding:64px 16px;color:#62708a}
  </style>
</head>
<body>
  <main class="loading">読み込み中…</main>
  <script>
    // ============================================================
    // ドローン練習ノート 共有ページ（GitHub Pages 静的ホスティング版）
    // データ・認証・アクセス制御は Supabase 側（RLS + SECURITY DEFINER
    // 関数 get_shared_page）で守る。ここに置く publishable キーは公開前提。
    // 無効/期限切れ/停止済みトークンは RPC が null を返す → 「見つかりません」。
    // ============================================================
    var SUPABASE_URL = 'https://kvffbiqtnotfyficvonv.supabase.co';
    var PUBLISHABLE_KEY = 'sb_publishable_vT_yhC6Fe1PlZyz1nmC0ww_w1ymIW54';

    var TOKEN_PATTERN = /^[A-Za-z0-9_-]{43}$/;
    var normalSkills = {
      safety_check: '安全確認', takeoff: '離陸', landing: '着陸', hovering: 'ホバリング',
      front_back_left_right: '前後左右移動', turning: '旋回', square_flight: '四角飛行',
      figure_eight: '8の字飛行', camera_control: 'カメラ操作', aerial_shooting: '空撮基礎',
      emergency_response: '緊急時対応'
    };
    var fpvSkills = {
      fpv_preparation: 'FPV準備', goggle_view: 'ゴーグル視点', arm_disarm: 'アーム・ディスアーム',
      throttle_control: 'スロットル操作', angle_mode: 'Angleモード', low_speed_flight: '低速飛行',
      straight_flight: '直線飛行', turning: '旋回', gate: 'ゲート通過', marker_turn: 'マーカー周回',
      figure_eight: 'FPV 8の字', indoor_course: '屋内コース', crash_response: '墜落後対応', acro_basic: 'Acro基礎'
    };
    var stages = { none: '未経験', practicing: '練習中', done: 'できた', stable: '安定してできる' };
    var ratings = { hard: 'まだ難しい', slightly: '少しできた', mostly: 'だいたいできた', stable: '安定してできた' };

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
      });
    }
    function tokenFromUrl(value) {
      var token = new URL(value).searchParams.get('token') || '';
      return TOKEN_PATTERN.test(token) ? token : null;
    }
    function date(value) {
      if (!value) return '—';
      var parsed = new Date(value + 'T00:00:00Z');
      return isNaN(parsed.valueOf()) ? '—' : (parsed.getUTCMonth() + 1) + '月' + parsed.getUTCDate() + '日';
    }
    function duration(value) {
      var total = Math.max(0, Number(value) || 0);
      var hours = Math.floor(total / 60);
      var minutes = total % 60;
      return hours ? (hours + '時間' + (minutes ? minutes + '分' : '')) : (minutes + '分');
    }
    function skillRows(skills, labels) {
      return Object.keys(labels).map(function (key) {
        return '<div class="skill"><span>' + escapeHtml(labels[key]) + '</span><b>' +
          escapeHtml((skills && stages[skills[key]]) || '未着手') + '</b></div>';
      }).join('');
    }
    function logCards(logs) {
      return logs.map(function (log) {
        var fpv = log.lesson_type === 'fpv';
        var details = [
          log.aircraft ? '✈ ' + log.aircraft : '', log.place ? '📍 ' + log.place : '',
          log.self_rating ? (ratings[log.self_rating] || log.self_rating) : '',
          log.crash_count !== undefined ? '墜落 ' + log.crash_count + '回' : '',
          log.has_damage !== undefined ? (log.has_damage ? '破損あり' : '破損なし') : ''
        ].filter(Boolean).map(escapeHtml).join(' 　');
        return '<section class="card log ' + (fpv ? 'fpv' : '') + '"><div class="head"><b>' +
          date(log.lesson_date) + '</b><span class="badge">' + (fpv ? 'FPV' : '通常') + '</span><span>' +
          escapeHtml(log.duration_minutes) + '分</span></div><p>' + (details || '詳細なし') + '</p>' +
          (log.next_task ? '<p>次回: ' + escapeHtml(log.next_task) + '</p>' : '') +
          (log.repair_memo ? '<p>修理メモ: ' + escapeHtml(log.repair_memo) + '</p>' : '') + '</section>';
      }).join('');
    }
    var style = ':root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:#17233d;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.top{padding:16px 20px;background:#15284b;color:white;font-weight:700}.readonly{padding:11px 20px;background:#e7f2ff;color:#185a9d;font-size:13px}.shell{width:min(760px,100%);margin:auto;padding:24px 16px 48px}.hero{margin-bottom:18px}.hero h1{font-size:24px;margin:0 0 8px}.hero p,.card p{color:#62708a;font-size:13px;line-height:1.6}.grid,.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #dde4ee;border-radius:14px;padding:16px;margin-bottom:12px}.metric b{display:block;font-size:26px;color:#145da0}.skill{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #edf0f5;font-size:13px}.skill:last-child{border:0}.skill b{color:#145da0}.head{display:flex;align-items:center;gap:10px}.badge{padding:3px 8px;border-radius:99px;background:#e7f2ff;color:#145da0;font-size:12px}.fpv .badge{background:#f1eaff;color:#6f42c1}h2{font-size:18px;margin:28px 0 12px}.footer{text-align:center;color:#8590a5;font-size:12px;margin-top:30px}@media(max-width:560px){.grid,.skills{grid-template-columns:1fr}.shell{padding-top:18px}}';

    function renderDocument(data) {
      var profile = (data && data.profile) || {};
      var summary = (data && data.summary) || {};
      var logs = (data && Array.isArray(data.lesson_logs)) ? data.lesson_logs : [];
      var title = (data && data.title) || ((profile.display_name || 'ユーザー') + 'さんの練習進捗');
      var meta = [profile.purpose ? '目的: ' + profile.purpose : '', summary.last_lesson_date ? '最終練習: ' + date(summary.last_lesson_date) : ''].filter(Boolean).join(' 　');
      var levels = (profile.normal_level != null ? '<section class="card metric"><small>通常ドローン 現在レベル</small><b>Lv.' + escapeHtml(profile.normal_level) + '</b></section>' : '') +
        (profile.fpv_level != null ? '<section class="card metric"><small>FPVドローン 現在レベル</small><b>Lv.' + escapeHtml(profile.fpv_level) + '</b></section>' : '');
      var skills = (data && data.normal_skills ? '<section class="card"><h3>通常ドローン</h3>' + skillRows(data.normal_skills, normalSkills) + '</section>' : '') +
        (data && data.fpv_skills ? '<section class="card"><h3>FPVドローン</h3>' + skillRows(data.fpv_skills, fpvSkills) + '</section>' : '');
      var lessons = (data && data.share_scope === 'skills_only') ? '' : ('<h2>最近の練習</h2>' + (logs.length ? logCards(logs) : '<section class="card">この期間の練習記録はありません</section>'));
      return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>' + escapeHtml(title) + ' | ドローン練習ノート</title><style>' + style + '</style></head><body><header class="top">✈ ドローン練習ノート</header><div class="readonly">👁 このページは閲覧専用です。練習記録やスキル評価を編集することはできません。</div><main class="shell"><section class="hero"><h1>' + escapeHtml(title) + '</h1>' + (meta ? '<p>' + escapeHtml(meta) + '</p>' : '') + '</section><div class="grid">' + levels + '<section class="card metric"><small>総練習回数</small><b>' + escapeHtml((summary.total_lessons != null ? summary.total_lessons : 0)) + '回</b></section><section class="card metric"><small>総練習時間</small><b>' + escapeHtml(duration(summary.total_duration_minutes)) + '</b></section></div>' + (skills ? '<h2>スキル進捗</h2><div class="skills">' + skills + '</div>' : '') + lessons + '<div class="footer">ドローン練習ノートで記録されています</div></main></body></html>';
    }
    function renderNotFound() {
      return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ページが見つかりません</title></head><body><main style="font-family:sans-serif;text-align:center;padding:64px 16px;color:#17233d"><h1>ページが見つかりません</h1><p style="color:#62708a">このリンクは無効か、期限切れ、または共有が停止されています。</p></main></body></html>';
    }
    function show(html) { document.open(); document.write(html); document.close(); }

    (function () {
      var token = tokenFromUrl(window.location.href);
      if (!token) { show(renderNotFound()); return; }
      fetch(SUPABASE_URL + '/rest/v1/rpc/get_shared_page', {
        method: 'POST',
        headers: {
          apikey: PUBLISHABLE_KEY,
          authorization: 'Bearer ' + PUBLISHABLE_KEY,
          'content-type': 'application/json'
        },
        body: JSON.stringify({ p_token: token })
      }).then(function (res) {
        if (!res.ok) throw new Error('rpc');
        return res.json();
      }).then(function (data) {
        if (!data || typeof data !== 'object') { show(renderNotFound()); return; }
        show(renderDocument(data));
      }).catch(function () { show(renderNotFound()); });
    })();
  </script>
</body>
</html>
